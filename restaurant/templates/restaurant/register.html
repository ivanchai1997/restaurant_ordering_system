{% extends "restaurant/base.html" %}
{% block title %}Create account · William’s{% endblock %}
{% block content %}
<div class="narrow">
  <h2>Create account</h2>
  <form method="post" class="panel stack formgrid">
    {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    {{ form.as_p }}
    <button class="btn">Create account</button>
  </form>
  <p class="hint">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</div>
{% endblock %}
