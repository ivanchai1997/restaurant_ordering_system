<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · William’s Restaurant</title>
<style>
@page{margin:6mm}
*{box-sizing:border-box}
body{margin:0;background:#e9e4da;color:#000;font:14px/1.5 'Courier New',Courier,monospace}
.sheet{max-width:340px;margin:18px auto;background:#fff;padding:18px 16px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.c{text-align:center}.big{font:700 20px/1.3 Georgia,serif}
.r{display:flex;justify-content:space-between;gap:8px}
hr{border:0;border-top:1px dashed #000;margin:10px 0}
.item{font-size:16px;padding:3px 0}.q{display:inline-block;min-width:3.2em;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:2px 0;vertical-align:top}.n{text-align:right}
.total{font-size:17px;font-weight:700}
.stamp{font:700 22px Georgia,serif;letter-spacing:.2em;border:2px solid #000;display:inline-block;padding:2px 18px;margin:8px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.actions button,.actions a{font:600 14px system-ui,sans-serif;padding:8px 16px;border-radius:99px;border:1px solid #5a1224;background:#fff;color:#5a1224;text-decoration:none;cursor:pointer}
.actions .go{background:#5a1224;color:#fff}
.actions form{margin:0}
@media print{body{background:#fff}.sheet{max-width:none;margin:0;padding:0;box-shadow:none}.noprint{display:none!important}}
</style>
</head>
<body>
<div class="sheet">{% block body %}{% endblock %}</div>
{% block script %}{% endblock %}
</body>
</html>
